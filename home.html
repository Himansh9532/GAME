<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Math Challenge Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #e0f7fa;
      text-align: center;
    }
    .navbar {
      background-color: #00796b;
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    .content {
      padding: 50px 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .game-button {
      padding: 15px 30px;
      font-size: 1.2rem;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 250px;
      transition: background-color 0.3s;
      text-decoration: none ;
    }

    .game-button:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <a href="home.html">Home</a>
    <a href="addition.html"> Addition</a>
    <a href="subtraction.html"> Subtraction</a>
    <a href="multiplication.html">Multiplication</a>
    <a href="division.html">Division</a>
  </div>

  <!-- Content -->
  <div class="content">
    <img src="iKIT-LAB-logo-png.webp" alt="i-KIT LAB Logo" class="logo" />
    <h1>🎮 Welcome to Math Challenge Hub!</h1>

    <div class="container">
      <a class="game-button" href="addition.html"> Addition Game</a>
      <a class="game-button" href="subtraction.html"> Subtraction Game</a>
      <a class="game-button" href="multiplication.html"> Multiplication Game</a>
      <a class="game-button" href="division.html">Division Game</a>
    </div>
  </div>

</body>
</html>
